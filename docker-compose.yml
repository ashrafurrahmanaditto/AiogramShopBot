services:
  bot:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - app_network
      - dokploy-network
    volumes:
      - ./i18n:/bot/i18n
    command: [ "python", "-u", "run.py" ]
    restart: always

  redis:
    image: redis:latest
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - app_network

  postgres:
    image: "postgres:18"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app_network
    restart: always

volumes:
  redis_data:
  postgres_data:

networks:
  app_network:
  dokploy-network:
    external: true
    
